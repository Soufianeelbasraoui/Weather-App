<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="container">
        <div class="container-img">
            <img src="./images/icons.png" alt="">
        </div>
        <div class="input">
           <i class="fa-solid fa-magnifying-glass" id="searchbtn"></i>
            <input type="text" placeholder="Search for City ..." id="searchinput" spellcheck="false">
        </div>
        <div class="icons-sunny">
            <img src="./images/sunny1.png" alt="" id="img-icons">
           <div class="img-moon">
             <i class="fas fa-moon"></i>
           </div>
        </div>
    </div>
    <hr>
    <div class="main">
    <div class="main-city">
        <div class="partly">
            <h2 id="title-city">
                <i class="fa-solid fa-location-dot"></i>
                madrid
            </h2>
            <img src="./images/icons.png" alt="" id="img-city">
        </div>
        <h1 id="temperature">35°c</h1>
        <p id="day">monday, 15 April 10:30 AM</p>
    </div>
    <div class="main-status">
      <div class="status">
            <i class="fa-solid fa-droplet"></i>
            <p >Humidity</p>
            <h3 id="Humidity">85%</h3>
        </div>
        <div class="status">
           <i class="fa-solid fa-wind"></i>
            <p>Wind</p>
            <h3 id="Wind">12 km/hr</h3>
        </div>
        <div class="status">
            <i class="fa-solid fa-sun"></i>
            <p>UV index</p>
            <h3 class="index">4</h3>
        </div>
        <div class="status">
          <div class="sunrise">
             <i class="fa-solid fa-sun"></i>
           </div>
            <p>Sunrise</p>
            <h3 id="sunrise">6:04 AM</h3>
        </div>
    </div>
</div>
<!--forecast--->
<div class="forecast1">
    <div class="h3">
        <h3>hourly forecast</h3>
    </div>
    <div class="forecast">

    </div>
    
</div>
<div class="forecast-weekly">
    <div class="h3">
        <h3>Weekly Forecast</h3> 
    </div>

    <div class="weekly-cards">
        <div class="day-card">
            <p class="day">Tuesday</p>
            <img src="https://img.icons8.com/color/48/sun.png" alt="sun" />
            <p class="temp">23°C</p>
            <p class="low">18°</p>
        </div>

        <div class="day-card">
            <p class="day">Wednesday</p>
            <img src="https://img.icons8.com/color/48/cloud.png" alt="cloud" />
            <p class="temp">23°C</p>
            <p class="low">18°</p>
        </div>

        <div class="day-card">
            <p class="day">Thursday</p>
            <img src="https://img.icons8.com/color/48/clouds.png" alt="clouds" />
            <p class="temp">23°C</p>
            <p class="low">18°</p>
        </div>

        <div class="day-card">
            <p class="day">Friday</p>
            <img src="https://img.icons8.com/color/48/rain.png" alt="rain" />
            <p class="temp">23°C</p>
            <p class="low">18°</p>
        </div>

        <div class="day-card">
            <p class="day">Saturday</p>
            <img src="https://img.icons8.com/color/48/partly-cloudy-day.png" alt="sun-cloud" />
            <p class="temp">23°C</p>
            <p class="low">18°</p>
        </div>

        <div class="day-card">
            <p class="day">Sunday</p>
            <img src="https://img.icons8.com/color/48/cloud.png" alt="cloud" />
            <p class="temp">23°C</p>
            <p class="low">18°</p>
        </div>
    </div>
</div>

<hr>
<!-- Footer -->
<div class="footer">
     <div class="footer-bottom">
        © 2025 WeatherApp — All rights reserved.
    </div>
    <div class="footer-icon">
        <a href="#"><i class="fa-brands fa-github"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
        <a href="#"><i class="fa-solid fa-envelope"></i></a>
    </div>

</div>
<script src="script.js"></script>
</body>
</html>
